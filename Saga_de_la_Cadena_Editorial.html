<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saga de la Cadena Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141210; --bg2:#1d1a16; --panel:#211d19; --stone:#2a241e;
  --gold:#c9a24b; --gold-d:#8a6c2e; --red:#8c1f1f; --red-l:#b5341f;
  --ice:#5c8ea3; --txt:#e7dfce; --txt-dim:#a99e89;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; height:100%; min-height:100vh; background:
    radial-gradient(ellipse at 20% 0%, #2a2117 0%, transparent 55%),
    radial-gradient(ellipse at 90% 100%, #1a1310 0%, transparent 55%), var(--bg);
  color:var(--txt); font-family:'EB Garamond',serif; display:flex; flex-direction:column;
}
header{padding:18px 20px 14px; text-align:center; border-bottom:2px solid var(--gold-d); background:linear-gradient(180deg,#1b1713,#141210);}
header h1{font-family:'Cinzel',serif; font-weight:900; letter-spacing:2px; margin:0; font-size:clamp(20px,4vw,34px); color:var(--gold); text-shadow:0 0 14px rgba(201,162,75,.35), 0 2px 0 #000;}
header p{margin:6px 0 0; color:var(--txt-dim); font-style:italic; font-size:14px;}
.wrap{display:flex; flex:1; min-height:0; max-width:1300px; margin:0 auto; width:100%;}
nav{width:230px; flex:0 0 230px; background:var(--bg2); border-right:2px solid var(--gold-d); overflow-y:auto; padding:10px;}
nav button{display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--txt-dim); font-family:'Cinzel',serif; font-size:12.5px; letter-spacing:.5px; padding:9px 10px; margin-bottom:4px; cursor:pointer; border-radius:3px; transition:.15s;}
nav button:hover{background:var(--stone); color:var(--txt);}
nav button.active{background:linear-gradient(90deg, rgba(140,31,31,.4), transparent); color:var(--gold); border-left:3px solid var(--red-l);}
main{flex:1; overflow-y:auto; padding:22px clamp(14px,3vw,34px) 40px;}
.chapter-title{font-family:'Cinzel',serif; color:var(--gold); font-size:clamp(18px,3vw,26px); border-bottom:1px solid var(--gold-d); padding-bottom:10px; margin:0 0 18px; letter-spacing:1px;}
.card{background:linear-gradient(180deg,var(--panel),#1a1612); border:1px solid #3a2f22; border-left:4px solid var(--red-l); border-radius:4px; padding:18px 20px; margin-bottom:22px; box-shadow:0 6px 18px rgba(0,0,0,.4);}
.card h3{font-family:'Cinzel',serif; color:var(--txt); font-size:16px; margin:0 0 4px; line-height:1.4;}
.card .tag{display:inline-block; font-family:'Cinzel',serif; font-size:10.5px; color:#1a1612; background:var(--gold); padding:2px 8px; border-radius:2px; margin-bottom:8px; letter-spacing:1px;}
.label{font-family:'Cinzel',serif; font-size:11px; color:var(--ice); letter-spacing:1.5px; margin:14px 0 6px; display:flex; align-items:center; gap:6px;}
.label::before{content:"⚔"; color:var(--red-l);}
pre{background:#0f0d0b; border:1px solid #3a2f22; border-radius:3px; padding:10px 12px; overflow-x:auto; font-size:12.5px; line-height:1.5; color:#d9c89a; margin:0;}
.explain{color:var(--txt-dim); font-size:15px; font-style:italic;}
.tbl-wrap{overflow-x:auto; border:1px solid #3a2f22; border-radius:3px;}
table{width:100%; border-collapse:collapse; font-size:12.5px; white-space:nowrap;}
th,td{border-bottom:1px solid #2c261f; padding:5px 10px; text-align:left; color:var(--txt);}
th{background:#241f1a; color:var(--gold); font-family:'Cinzel',serif; font-size:10.5px; letter-spacing:.5px; position:sticky; top:0;}
tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.empty-note{padding:8px 10px; color:var(--txt-dim); font-style:italic;}
.footer-nav{display:flex; justify-content:space-between; gap:10px; max-width:1300px; margin:0 auto; width:100%; padding:10px clamp(14px,3vw,34px) 18px;}
.footer-nav button{font-family:'Cinzel',serif; background:var(--stone); border:1px solid var(--gold-d); color:var(--gold); padding:10px 18px; border-radius:3px; cursor:pointer; font-size:13px; letter-spacing:1px;}
.footer-nav button:disabled{opacity:.3; cursor:default;}
::-webkit-scrollbar{width:9px; height:9px;} ::-webkit-scrollbar-thumb{background:#3a2f22; border-radius:5px;}
@media (max-width:720px){
  .wrap{flex-direction:column;}
  nav{width:100%; flex:0 0 auto; max-height:140px; border-right:none; border-bottom:2px solid var(--gold-d); display:flex; flex-wrap:nowrap; overflow-x:auto;}
  nav button{display:inline-block; width:auto; white-space:nowrap; margin-right:6px;}
}
</style>
</head>

let current = 0;
const navEl = document.getElementById('nav');
const mainEl = document.getElementById('main');

function renderTable(colsStr, rowsStr){
  if(!rowsStr || !rowsStr.trim()) return '<div class="empty-note">— Sin resultados —</div>';
  const cols = colsStr.split('|');
  const rows = rowsStr.trim().split('\n').map(r=>r.split('|'));
  let h = '<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  h += '</tbody></table></div>';
  return h;
}

DATA.forEach((ch,i)=>{
  const b = document.createElement('button');
  b.textContent = 'Cap. '+String(i+1).padStart(2,'0')+' · Desafíos '+ch[1];
  b.onclick = ()=>render(i);
  navEl.appendChild(b);
});

function render(i){
  current = i;
  [...navEl.children].forEach((b,idx)=>b.classList.toggle('active', idx===i));
  const ch = DATA[i];
  let html = '<div class="chapter-title">⚔ CAPÍTULO '+String(i+1).padStart(2,'0')+' — DESAFÍOS '+ch[1]+'</div>';
  ch[2].forEach((d,n)=>{
    html += '<div class="card"><span class="tag">PRUEBA '+(n+1)+'</span><h3>'+d[0]+'</h3>'
      + '<div class="label">Runa de invocación (SQL)</div><pre>'+d[1].replace(/</g,'&lt;')+'</pre>'
      + '<div class="label">Tabla de resultados</div>'+renderTable(d[2], d[3])
      + '<div class="label">Sabiduría del Oráculo</div><div class="explain">'+d[4]+'</div></div>';
  });
  mainEl.innerHTML = html;
  mainEl.scrollTop = 0;
  document.getElementById('prev').disabled = i===0;
  document.getElementById('next').disabled = i===DATA.length-1;
}
document.getElementById('prev').onclick = ()=>render(Math.max(0,current-1));
document.getElementById('next').onclick = ()=>render(Math.min(DATA.length-1,current+1));
render(0);
</script>
