<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portafolio Base de Datos 2</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            max-width: 500px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h2 {
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .btn-full {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 15px;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-full:hover {
            background-color: var(--secondary-color);
        }
        .btn-guest {
            background-color: #6c757d;
        }
        .btn-guest:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="uplalogo.png" alt="Logo UPLA" style="height: 80px; margin-bottom: 20px;">
        <h2>Panel de Acceso</h2>
        
        <a href="portafolio.html" class="btn-full btn-guest">👀 Entrar como Visitante</a>
        
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
        
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 20px;">Área Administrativa (Requiere Token de GitHub)</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="githubToken">Token de GitHub (PAT):</label>
                <input type="password" id="githubToken" placeholder="ghp_..." required>
            </div>
            <button type="submit" class="btn-full">🔑 Entrar como Administrador</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const token = document.getElementById('githubToken').value;
            localStorage.setItem('github_token', token);
            window.location.href = 'admin.html';
        });
    </script>
</body>
</html>
